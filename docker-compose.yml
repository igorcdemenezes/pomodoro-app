services:
  postgres:
    image: postgres:16-alpine
    container_name: pomodoro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomodoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomodoro}
      POSTGRES_DB: ${POSTGRES_DB:-pomodoro}
      # Deterministic collation so ORDER BY behaves the same locally and in CI.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TEST_DATABASE: ${TEST_DATABASE:-pomodoro_test}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Dependent services must wait for the database to accept connections,
      # not merely for the container to exist.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pomodoro} -d ${POSTGRES_DB:-pomodoro}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Optional: `docker compose up` brings the whole stack up, which is the
    # fastest way to evaluate the project without a Node toolchain installed.
    # Day-to-day development still runs the API on the host with `npm run api
    # start:dev`, for watch mode.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pomodoro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network the database answers on its service name and
      # its own port, not on the port published to the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pomodoro}:${POSTGRES_PASSWORD:-pomodoro}@postgres:5432/${POSTGRES_DB:-pomodoro}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL_SEC: ${JWT_ACCESS_TTL_SEC:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
    name: pomodoro-pgdata
